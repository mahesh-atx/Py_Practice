<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Python — PyPractice</title>
    <script>
      tailwind = { config: { darkMode: 'class' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="site-shell min-h-screen flex flex-col">
      <!-- Header -->
      <header class="header-blur sticky top-0 z-50 border-b border-line shrink-0">
        <div class="app-max h-[76px] flex items-center justify-between">
          <a href="index.html" class="text-[27px] tracking-[-.05em] font-medium inline-flex items-center gap-2.5"><span class="h-8 w-8 rounded-[10px] bg-[var(--green)] text-white grid place-items-center text-[16px] shadow-sm shrink-0"><i class="fa-brands fa-python"></i></span> PyPractice</a>
          <nav class="hidden md:flex items-center gap-8 text-sm text-muted">
            <a href="index.html" class="hover:text-ink">Home</a>
            <a href="learn.html" class="text-ink font-medium">Learn</a>
            <a href="topics.html" class="hover:text-ink">Practice</a>
            <!-- Only visible when logged in -->
            <a href="progress.html" data-auth-only class="hover:text-ink hidden">Progress</a>
            <a href="guide.html" class="hover:text-ink">Python Guide</a>
            <!-- Only visible when logged in -->
            <a href="profile.html" data-auth-only class="hover:text-ink hidden">Profile</a>
          </nav>
          <div class="flex items-center gap-2.5">
            <!-- GUEST ONLY: Login & Sign up buttons -->
            <div data-guest-only class="hidden sm:inline-flex items-center gap-2">
              <a href="login.html" class="btn-ghost px-4 py-2 text-xs rounded-[10px] font-medium">Login</a>
              <a href="signup.html" class="btn-primary px-4 py-2 text-xs rounded-[10px] font-medium shadow-sm">Sign up</a>
            </div>

            <!-- AUTH ONLY: Logged-in User Chip & Logout -->
            <div data-auth-only class="hidden inline-flex items-center gap-2">
              <a href="profile.html" class="btn-ghost px-3 py-1.5 text-xs rounded-[10px] inline-flex items-center gap-2 border border-line" title="View Profile">
                <span class="w-5 h-5 rounded-full bg-[var(--green)] text-white text-[10px] font-bold grid place-items-center" data-user-initial>U</span>
                <span class="font-medium text-ink max-w-[110px] truncate" data-user-name>User</span>
              </a>
              <button data-logout-btn type="button" class="btn-ghost h-9 w-9 grid place-items-center text-xs rounded-[10px] text-muted hover:text-red-500 hover:border-red-200 transition" title="Sign out">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            </div>

            <button
              data-theme-toggle
              class="h-10 w-10 border border-line grid place-items-center text-sm btn-ghost rounded-[10px]"
              aria-label="Toggle dark mode"
            >
              <span data-theme-icon>◐</span>
            </button>
            <button data-mobile-toggle class="md:hidden h-10 w-10 border border-line btn-ghost rounded-[10px]">
              ☰
            </button>
          </div>
        </div>
        <div id="mobileMenu" class="mobile-menu border-t border-line md:hidden">
          <div class="app-max py-4 grid gap-2 text-sm">
            <a href="index.html" class="py-2">Home</a>
            <a href="learn.html" class="py-2 font-medium text-ink">Learn</a>
            <a href="topics.html" class="py-2">Practice</a>
            <a href="progress.html" data-auth-only class="py-2 hidden">Progress</a>
            <a href="guide.html" class="py-2">Python Guide</a>
            <a href="profile.html" data-auth-only class="py-2 hidden">Profile</a>

            <!-- GUEST ONLY in mobile menu: Login & Sign up -->
            <div data-guest-only class="pt-3 mt-3 border-t border-line grid grid-cols-2 gap-2">
              <a href="login.html" class="btn-ghost py-2.5 text-xs rounded-[10px] inline-flex items-center justify-center gap-2"><i class="fa-solid fa-right-to-bracket text-[11px]"></i> Login</a>
              <a href="signup.html" class="btn-primary py-2.5 text-xs rounded-[10px] inline-flex items-center justify-center gap-2"><i class="fa-solid fa-user-plus text-[11px]"></i> Sign up</a>
            </div>

            <!-- AUTH ONLY in mobile menu: User Card & Sign out -->
            <div data-auth-only class="pt-3 mt-3 border-t border-line hidden">
              <div class="flex items-center justify-between py-1">
                <div class="flex items-center gap-2.5">
                  <span class="w-8 h-8 rounded-full bg-[var(--green)] text-white text-xs font-bold grid place-items-center" data-user-initial>U</span>
                  <div>
                    <div class="text-xs font-semibold text-ink" data-user-name>User</div>
                    <div class="text-[11px] text-muted truncate max-w-[180px]" data-user-email>user@example.com</div>
                  </div>
                </div>
                <button data-logout-btn type="button" class="btn-ghost px-3 py-1.5 text-xs rounded-[8px] text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30">Sign out</button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Learning Shell -->
      <div id="learnPage" class="flex-1 flex flex-col lg:flex-row lg:items-start min-h-0 app-max w-full">
        <!-- Left Sidebar: Topic Selector (Sticky on Desktop) -->
        <aside class="w-full lg:w-[clamp(320px,28vw,380px)] shrink-0 border-b lg:border-b-0 lg:border-r border-line py-6 lg:py-8 lg:pr-7 flex flex-col lg:sticky lg:top-[76px] lg:h-[calc(100vh-76px)] lg:overflow-hidden lg:self-start">
          <div class="flex items-center justify-between gap-3 mb-4 shrink-0">
            <div>
              <div class="text-[10px] uppercase tracking-[.2em] text-muted font-mono font-semibold flex items-center gap-1.5">
                <i class="fa-solid fa-book-bookmark text-[11px] text-[var(--green)]"></i> Documentation
              </div>
              <h1 class="text-2xl tracking-[-.03em] font-bold mt-1 text-ink flex items-center gap-2">
                Knowledge Base
              </h1>
            </div>
            <span id="learnProgressBadge" class="inline-flex items-center gap-1.5 text-[11px] font-mono font-medium bg-[var(--soft)] border border-line px-2.5 py-1 rounded-full text-muted shrink-0">
              <i class="fa-solid fa-layer-group text-[10px] opacity-60"></i> 0/18 started
            </span>
          </div>

          <!-- Search Filter -->
          <div class="relative mb-3.5 shrink-0 group search-wrap" style="position:relative; display:flex;">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none text-xs transition-colors group-focus-within:text-[var(--green)] z-10"><i class="fa-solid fa-magnifying-glass"></i></span>
            <input
              id="learnTopicSearch"
              type="text"
              class="w-full border border-line panel pl-10 pr-9 py-2.5 text-xs outline-none rounded-[12px] transition focus:border-[var(--green)] focus:ring-2 focus:ring-[var(--green)]/15"
              placeholder="Search concepts or syntax..."
            />
            <button id="learnSearchClear" class="hidden absolute right-3 top-1/2 -translate-y-1/2 h-5 w-5 rounded-full bg-[var(--soft)] hover:bg-red-50 hover:text-red-600 text-muted grid place-items-center text-[10px] transition" title="Clear search">✕</button>
          </div>

          <!-- Topics List (Independently Scrollable with side-scroll) -->
          <div id="learnTopicList" class="flex-1 overflow-y-auto side-scroll space-y-2 max-h-[380px] lg:max-h-none pr-1.5 pb-4 stagger">
            <!-- Rendered by JS -->
          </div>

        </aside>

        <!-- Right Pane: Active Topic Notes Workspace -->
        <main class="flex-1 min-w-0 py-6 lg:py-8 lg:pl-10 xl:pl-12">
          <div id="learnContent" class="max-w-4xl pb-20">
            <!-- Dynamic Topic Notes rendered by JS -->
          </div>
        </main>
      </div>

    </div>

    <div id="toast" class="toast"></div>

    <script src="js/topics-data.js"></script>
    <script src="js/topic-notes-data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/learn.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
