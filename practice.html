<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practice — PyPractice</title>
    <script>
      tailwind = { config: { darkMode: 'class' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="site-shell min-h-screen flex flex-col">
      <header class="header-blur sticky top-0 z-50 border-b border-line shrink-0">
        <div class="app-max h-[76px] flex items-center justify-between">
          <div class="flex items-center gap-3">
            <a href="index.html" class="text-[27px] tracking-[-.05em] font-medium inline-flex items-center gap-2.5"><span class="h-8 w-8 rounded-[10px] bg-[var(--green)] text-white grid place-items-center text-[16px] shadow-sm shrink-0"><i class="fa-brands fa-python"></i></span> PyPractice</a>
          </div>
          <nav class="hidden md:flex items-center gap-8 text-sm text-muted">
            <a href="index.html" class="hover:text-ink">Home</a>
            <a href="learn.html" class="hover:text-ink">Learn</a>
            <a href="topics.html" class="text-ink font-medium">Practice</a>
            <!-- Only visible when logged in -->
            <a href="progress.html" data-auth-only class="hover:text-ink hidden">Progress</a>
            <a href="guide.html" class="hover:text-ink">Python Guide</a>
            <!-- Only visible when logged in -->
            <a href="profile.html" data-auth-only class="hover:text-ink hidden">Profile</a>
          </nav>
          <div class="flex items-center gap-2.5">
            <!-- GUEST ONLY: Login & Sign up buttons -->
            <div data-guest-only class="hidden sm:inline-flex items-center gap-2">
              <a href="login.html" class="btn-ghost px-4 py-2 text-xs rounded-[10px] font-medium">Login</a>
              <a href="signup.html" class="btn-primary px-4 py-2 text-xs rounded-[10px] font-medium shadow-sm">Sign up</a>
            </div>

            <!-- AUTH ONLY: Logged-in User Chip & Logout -->
            <div data-auth-only class="hidden inline-flex items-center gap-2">
              <a href="profile.html" class="btn-ghost px-3 py-1.5 text-xs rounded-[10px] inline-flex items-center gap-2 border border-line" title="View Profile">
                <span class="w-5 h-5 rounded-full bg-[var(--green)] text-white text-[10px] font-bold grid place-items-center" data-user-initial>U</span>
                <span class="font-medium text-ink max-w-[110px] truncate" data-user-name>User</span>
              </a>
              <button data-logout-btn type="button" class="btn-ghost h-9 w-9 grid place-items-center text-xs rounded-[10px] text-muted hover:text-red-500 hover:border-red-200 transition" title="Sign out">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            </div>

            <button data-theme-toggle class="h-10 w-10 border border-line btn-ghost rounded-[10px]" aria-label="Toggle theme">
              <span data-theme-icon>◐</span>
            </button>
            <button data-mobile-toggle class="md:hidden h-10 w-10 border border-line btn-ghost rounded-[10px]">☰</button>
          </div>
        </div>
        <div id="mobileMenu" class="mobile-menu border-t border-line md:hidden">
          <div class="app-max py-4 grid gap-2 text-sm">
            <a href="index.html" class="py-2">Home</a>
            <a href="learn.html" class="py-2">Learn</a>
            <a href="topics.html" class="py-2 font-medium text-ink">Practice</a>
            <a href="progress.html" data-auth-only class="py-2 hidden">Progress</a>
            <a href="guide.html" class="py-2">Python Guide</a>
            <a href="profile.html" data-auth-only class="py-2 hidden">Profile</a>

            <!-- GUEST ONLY in mobile menu: Login & Sign up -->
            <div data-guest-only class="pt-3 mt-3 border-t border-line grid grid-cols-2 gap-2">
              <a href="login.html" class="btn-ghost py-2.5 text-xs rounded-[10px] inline-flex items-center justify-center gap-2"><i class="fa-solid fa-right-to-bracket text-[11px]"></i> Login</a>
              <a href="signup.html" class="btn-primary py-2.5 text-xs rounded-[10px] inline-flex items-center justify-center gap-2"><i class="fa-solid fa-user-plus text-[11px]"></i> Sign up</a>
            </div>

            <!-- AUTH ONLY in mobile menu: User Card & Sign out -->
            <div data-auth-only class="pt-3 mt-3 border-t border-line hidden">
              <div class="flex items-center justify-between py-1">
                <div class="flex items-center gap-2.5">
                  <span class="w-8 h-8 rounded-full bg-[var(--green)] text-white text-xs font-bold grid place-items-center" data-user-initial>U</span>
                  <div>
                    <div class="text-xs font-semibold text-ink" data-user-name>User</div>
                    <div class="text-[11px] text-muted truncate max-w-[180px]" data-user-email>user@example.com</div>
                  </div>
                </div>
                <button data-logout-btn type="button" class="btn-ghost px-3 py-1.5 text-xs rounded-[8px] text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30">Sign out</button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="learning-shell flex-1">
        <main class="flex-1 min-w-0">
          <div class="px-5 sm:px-8 lg:px-12 py-10 border-b border-line">
            <div class="content-max">

              <div class="mt-7 flex flex-col md:flex-row md:items-end justify-between gap-6">
                <div>
                  <!-- Breadcrumb -->
                  <nav id="practiceBreadcrumb" class="flex items-center gap-1.5 text-[12px] text-muted font-mono mb-3">
                    <a href="index.html" class="flex items-center gap-1 hover:text-ink transition"><i class="fa-solid fa-house text-[10px]"></i> Home</a>
                    <span class="opacity-40">/</span>
                    <a href="topics.html" class="hover:text-ink transition">Practice</a>
                    <span class="opacity-40">/</span>
                    <span id="practiceBreadcrumbTopic" class="text-[var(--green)] font-semibold">Topic</span>
                  </nav>
                  <h1 id="practicePageTitle" class="text-5xl tracking-[-.05em] font-medium">Basic practice</h1>
                </div>
                <div class="flex flex-wrap gap-2 shrink-0 mb-1">
                  <a data-level-link data-level="basic" class="btn-ghost px-4 py-2.5 text-xs rounded-[10px] inline-flex items-center gap-1.5"><i class="fa-solid fa-leaf text-[11px] opacity-70"></i> Basic</a>
                  <a data-level-link data-level="intermediate" class="btn-ghost px-4 py-2.5 text-xs rounded-[10px] inline-flex items-center gap-1.5"><i class="fa-solid fa-layer-group text-[11px] opacity-70"></i> Intermediate</a>
                  <a data-level-link data-level="advanced" class="btn-ghost px-4 py-2.5 text-xs rounded-[10px] inline-flex items-center gap-1.5"><i class="fa-solid fa-rocket text-[11px] opacity-70"></i> Advanced</a>
                </div>
              </div>
              <div class="mt-6 flex items-center justify-between gap-4">
                <div class="h-1.5 flex-1 progress-track rounded-full overflow-hidden">
                  <div data-overall-bar class="green-bg h-full rounded-full transition-all duration-700" style="width:0%"></div>
                </div>
                <span data-overall-pct class="text-xs text-muted font-mono inline-flex items-center gap-1.5"><i class="fa-solid fa-chart-simple text-[11px] opacity-60"></i> 0%</span>
              </div>
              <p id="practiceTopicDesc" class="text-sm text-muted leading-7 mt-5 max-w-2xl"></p>
            </div>
          </div>
          <div class="px-5 sm:px-8 lg:px-12 py-8">
            <div class="content-max">
              <div class="flex justify-between text-xs text-muted mb-5 font-mono">
                <span id="practiceCount" class="inline-flex items-center gap-1.5"><i class="fa-solid fa-list-ol text-[11px] opacity-60"></i> 3 questions</span>
                <span id="practiceProgress" class="inline-flex items-center gap-1.5"><i class="fa-solid fa-chart-pie text-[11px] opacity-60"></i> 0% complete</span>
              </div>
              <div id="practiceQuestionList" class="space-y-4"></div>
            </div>
          </div>
        </main>
      </div>

    </div>

    <div id="toast" class="toast"></div>

    <script src="js/topics-data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
